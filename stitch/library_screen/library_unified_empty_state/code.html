<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-shift-surface-container-low {
            background-color: #f6f3f6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50/70 dark:bg-[#171c3c]/70 backdrop-blur-xl shadow-[0px_12px_32px_rgba(27,27,30,0.08)] flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User profile" class="w-full h-full object-cover" data-alt="Close-up portrait of a refined young man with soft lighting, professional and elegant aesthetic, neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmnBSHqcB1TIsqZy8emE6gDAjF72nMJKa4A178Go0YRmBP417zzWtnhg3sbp-GkN0pXNn9kTwyQFXHNCgh7aSmRSnMFGUHu2vlyAm9W6IHvv8GYaaNPFHo12MpgCZ9YhXqS_Mq0EVRAHxxrMTlKjdut-NJy3CHFKFWZJJqdYB53C_T1kTQOTQH7vDRQRhnNf8jPc6E40XfKtekTImOwoWR29NhPRTpWOS7O3f2zhnEPPhesnGslts-LiZJRjisfdUUr2aU999o808d"/>
</div>
<h1 class="text-[#171c3c] dark:text-[#dee1ff] font-serif italic font-black text-2xl tracking-tight">The Atelier</h1>
</div>
<button class="text-[#171c3c] dark:text-[#dee1ff] hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center px-8 pt-24 pb-32">
<div class="max-w-md w-full flex flex-col items-center text-center">
<!-- Minimalist Illustration Container -->
<div class="relative w-full aspect-square mb-12 group">
<!-- Background Glow -->
<div class="absolute inset-0 bg-secondary-container opacity-20 blur-3xl rounded-full scale-75 group-hover:scale-100 transition-transform duration-700"></div>
<!-- Stylized Open Book Illustration -->
<div class="relative z-10 w-full h-full flex items-center justify-center">
<div class="relative w-64 h-80 bg-surface-container-lowest rounded-xl shadow-[0px_24px_48px_rgba(27,27,30,0.06)] border border-outline-variant/10 transform -rotate-3 transition-transform hover:rotate-0 duration-500 overflow-hidden">
<!-- Book "Paper" Texture/Lines -->
<div class="absolute inset-0 p-8 flex flex-col gap-4">
<div class="h-4 bg-surface-container rounded-full w-3/4"></div>
<div class="h-4 bg-surface-container rounded-full w-full"></div>
<div class="h-4 bg-surface-container rounded-full w-5/6"></div>
<div class="mt-8 h-32 bg-secondary-container/30 rounded-lg w-full flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-5xl" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>
<div class="mt-4 h-4 bg-surface-container rounded-full w-full"></div>
<div class="h-4 bg-surface-container rounded-full w-2/3"></div>
</div>
<!-- Book Spine Shadow -->
<div class="absolute left-0 top-0 bottom-0 w-4 bg-gradient-to-r from-black/5 to-transparent"></div>
</div>
<!-- Decorative Floating Element -->
<div class="absolute -right-4 top-1/4 w-20 h-20 bg-primary-container rounded-2xl rotate-12 shadow-xl flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">bookmark</span>
</div>
</div>
</div>
<!-- Empty State Typography -->
<div class="space-y-4 mb-10">
<h2 class="font-headline text-3xl font-bold text-on-surface tracking-tight">Your library is empty.</h2>
<p class="font-body text-on-surface-variant text-lg leading-relaxed max-w-xs mx-auto">
                    Start adding stories to your collection and build your personal literary sanctuary.
                </p>
</div>
<!-- Primary CTA -->
<button class="group relative px-10 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full font-label font-bold tracking-wide shadow-lg hover:shadow-2xl transition-all duration-300 active:scale-95 overflow-hidden">
<span class="relative z-10 flex items-center gap-2">
                    Browse Novels
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/70 dark:bg-[#171c3c]/70 backdrop-blur-xl shadow-[0px_-12px_32px_rgba(27,27,30,0.05)] rounded-t-3xl border-t border-white/10">
<!-- Home Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-6 py-2 hover:text-[#171c3c] dark:hover:text-[#dee1ff] transition-colors active:scale-90 duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-sans text-[11px] font-semibold uppercase tracking-widest">Home</span>
</a>
<!-- Library Tab (Active) -->
<a class="flex flex-col items-center justify-center text-[#171c3c] dark:text-[#dee1ff] bg-[#dee1ff]/20 dark:bg-[#2d3252] rounded-full px-6 py-2 transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="shelves" style="font-variation-settings: 'FILL' 1;">shelves</span>
<span class="font-sans text-[11px] font-semibold uppercase tracking-widest">Library</span>
</a>
</nav>
<!-- Floating Background Elements for Editorial Feel -->
<div class="fixed top-1/3 -left-12 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-12 w-80 h-80 bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
</body></html>
